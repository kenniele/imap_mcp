services:
  mail-mcp:
    build: .
    restart: unless-stopped
    environment:
      HTTP_ADDR: :8080
      DATABASE_URL: postgres://mailmcp:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/mailmcp?sslmode=disable
      MCP_SECRET_KEY: ${MCP_SECRET_KEY:?set MCP_SECRET_KEY}
      MCP_AUTH_TOKEN: ${MCP_AUTH_TOKEN:?set MCP_AUTH_TOKEN}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_MODE: ${AUTH_MODE:-bearer}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      MCP_PUBLIC_URL: ${MCP_PUBLIC_URL:-}
      OIDC_ALLOWED_SUBJECT: ${OIDC_ALLOWED_SUBJECT:-}
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    stop_grace_period: 15s
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: mailmcp
      POSTGRES_USER: mailmcp
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./migrations/001_accounts.sql:/docker-entrypoint-initdb.d/001_accounts.sql:ro
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U mailmcp -d mailmcp"]
      interval: 5s
      timeout: 3s
      retries: 10
  caddy:
    image: caddy:2-alpine
    profiles: [https]
    restart: unless-stopped
    environment:
      MCP_DOMAIN: ${MCP_DOMAIN:-localhost}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on: [mail-mcp]
volumes:
  postgres_data:
  caddy_data:
  caddy_config:
