name: deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Let an active deployment finish; serialize subsequent releases.
concurrency:
  group: imap-mcp-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/kenniele/imap_mcp

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: mailmcp_test
          POSTGRES_USER: mailmcp
          POSTGRES_PASSWORD: integration-only-password
        ports: [5432:5432]
        options: >-
          --health-cmd "pg_isready -U mailmcp -d mailmcp_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://mailmcp:integration-only-password@localhost:5432/mailmcp_test?sslmode=disable
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - run: go vet ./...
      - run: go test -race -count=1 -tags=integration ./...
      - uses: golangci/golangci-lint-action@v9
        with:
          version: latest
      - name: Check reachable dependency vulnerabilities
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
      - run: bash -n deploy/release.sh
      - run: python3 -m unittest discover -s deploy -p 'test_*.py'
      - name: Check production Compose
        env:
          MCP_IMAGE: ghcr.io/kenniele/imap_mcp:${{ github.sha }}
          POSTGRES_PASSWORD: compose-validation-password
          MCP_SECRET_KEY: compose-validation-key
          MCP_AUTH_TOKEN: compose-validation-token
          MCP_PUBLIC_URL: https://imap-mcp.chickenkiller.com/mcp
        run: docker compose -f deploy/docker-compose.prod.yml config --quiet

  build:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:latest
            ${{ env.IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - name: Upload and deploy release over SSH
        env:
          SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          SSH_HOST: ${{ secrets.DEPLOY_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PORT: ${{ secrets.DEPLOY_PORT }}
          SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          RELEASE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          : "${SSH_KEY:?set DEPLOY_SSH_KEY}"
          : "${SSH_HOST:?set DEPLOY_HOST}"
          : "${SSH_USER:?set DEPLOY_USER}"
          : "${SSH_KNOWN_HOSTS:?set DEPLOY_KNOWN_HOSTS to the verified server host key}"
          port="${SSH_PORT:-22}"
          root="${DEPLOY_PATH:-/home/fitlog/imap_mcp}"
          [[ "$root" =~ ^/[a-zA-Z0-9_./-]+$ ]] && [[ "$root" != / ]]
          [[ "$port" =~ ^[0-9]+$ ]] && [[ "$SSH_USER" =~ ^[a-zA-Z0-9_-]+$ ]]
          [[ "$SSH_HOST" =~ ^[a-zA-Z0-9.:-]+$ ]]
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_deploy ~/.ssh/known_hosts
          ssh_options=(-i ~/.ssh/id_deploy -p "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes -o ConnectTimeout=15 -o ServerAliveInterval=20 -o ServerAliveCountMax=3)
          remote="$SSH_USER@$SSH_HOST"
          incoming="$root/deploy/releases/$RELEASE_SHA"
          ssh "${ssh_options[@]}" "$remote" "mkdir -p '$incoming'"
          scp -i ~/.ssh/id_deploy -P "$port" -o BatchMode=yes -o StrictHostKeyChecking=yes \
            deploy/docker-compose.prod.yml deploy/release.sh "$remote:$incoming/"
          ssh "${ssh_options[@]}" "$remote" \
            "bash '$incoming/release.sh' '$root' '$IMAGE:$RELEASE_SHA'"
